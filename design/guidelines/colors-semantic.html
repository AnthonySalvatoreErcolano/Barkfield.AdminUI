le="height:40px;background:var(--status-neutral-solid)"></div><div style="background:var(--status-neutral-bg);color:var(--status-neutral-fg);padding:10px 12px;font:700 12px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase">Neutral · Cancelled</div></div></div></body></html>
