<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Mostly square & tight; pills and circles echo the round badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--white);font-family:var(--font-body);color:var(--text-primary)}.cap{font:700 10.5px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}.mono{font:400 12px/1.3 var(--font-body);color:var(--ink-600)}</style></head><body><div style="display:flex;gap:18px"><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-xs)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">xs · 2px</div><div class="mono">checkbox</div></div><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-sm)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">sm · 4px</div><div class="mono">buttons, inputs</div></div><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-md)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">md · 6px</div><div class="mono">cards, alerts</div></div><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-lg)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">lg · 10px</div><div class="mono">dialogs</div></div><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-pill)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">pill · 999px</div><div class="mono">badges, chips</div></div><div style="flex:1"><div style="height:64px;background:var(--cream-300);border:2px solid var(--teal-500);border-radius:var(--radius-round)"></div><div class="cap" style="margin-top:8px;color:var(--ink-800)">round · 50%</div><div class="mono">avatars, icon discs</div></div></div></body></html>
