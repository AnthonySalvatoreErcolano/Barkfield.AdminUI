<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Warm, low shadows — borders do most of the work" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--white);font-family:var(--font-body);color:var(--text-primary)}.cap{font:700 10.5px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}.mono{font:400 12px/1.3 var(--font-body);color:var(--ink-600)}body{background:var(--bg-app)}</style></head><body><div style="display:flex;gap:22px;padding:8px 4px"><div style="flex:1;height:96px;background:#fff;border-radius:6px;box-shadow:var(--shadow-xs);border:1px solid var(--border-default);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><div class="cap" style="color:var(--ink-800)">shadow-xs</div><div class="mono">cards at rest</div></div><div style="flex:1;height:96px;background:#fff;border-radius:6px;box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><div class="cap" style="color:var(--ink-800)">shadow-sm</div><div class="mono">switch thumb, pill tab</div></div><div style="flex:1;height:96px;background:#fff;border-radius:6px;box-shadow:var(--shadow-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><div class="cap" style="color:var(--ink-800)">shadow-md</div><div class="mono">tooltips, menus</div></div><div style="flex:1;height:96px;background:#fff;border-radius:6px;box-shadow:var(--shadow-lg);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><div class="cap" style="color:var(--ink-800)">shadow-lg</div><div class="mono">dialogs, toasts</div></div></div></body></html>
