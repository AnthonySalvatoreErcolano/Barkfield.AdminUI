<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--white);font-family:var(--font-body);color:var(--text-primary)}.cap{font:700 10.5px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}.mono{font:400 12px/1.3 var(--font-body);color:var(--ink-600)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div><div class="cap" style="color:var(--teal-500)">✓ Correct — tracking 10</div><div style="font:900 30px/1.1 var(--font-display);letter-spacing:.01em;color:var(--tan-500)">BARKFIELD ROAD AUTOSHIP</div></div>
<div><div class="cap" style="color:var(--terracotta-500)">✕ Not enough character space</div><div style="font:900 30px/1.1 var(--font-display);letter-spacing:-.05em;color:var(--tan-500);opacity:.6">BARKFIELD ROAD AUTOSHIP</div></div>
<div><div class="cap" style="color:var(--terracotta-500)">✕ Too much character space</div><div style="font:900 30px/1.1 var(--font-display);letter-spacing:.3em;color:var(--tan-500);opacity:.6">BARKFIELD ROAD</div></div></div></body></html>
