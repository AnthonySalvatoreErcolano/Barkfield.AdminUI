<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body)}.split{display:grid;grid-template-columns:1fr 1fr;height:100vh}.split>div{display:flex;align-items:center;justify-content:space-evenly;gap:16px;padding:16px}.c{background:var(--cream-300)}.t{background:var(--teal-500)}img{display:block;max-width:100%}.cap{font:700 10.5px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500)}</style></head><body><div style="padding:20px 24px;display:flex;flex-wrap:wrap;gap:22px;background:#fff" id="g"></div><script>const n=['layout-dashboard','repeat','calendar-days','truck','package','users','dog','bone','map-pin','phone','mail','credit-card','skip-forward','pause','bell','search','filter','settings','cake','store'];document.getElementById('g').innerHTML=n.map(x=>'<div style="width:24px;height:24px;background:var(--teal-500);-webkit-mask:url(../assets/icons/'+x+'.svg) center/contain no-repeat;mask:url(../assets/icons/'+x+'.svg) center/contain no-repeat" title="'+x+'"></div>').join('')</script></body></html>
